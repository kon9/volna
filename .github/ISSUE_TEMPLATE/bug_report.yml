name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Before you start: press **Update yt-dlp** in the app and try again. Sites change often, and this fixes many problems. Please do not paste links to copyrighted content, cookies, or anything from your data folder."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Volna version and system
      placeholder: 1.0.0 on Windows 11
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Right-click the card and copy its log, or press Ctrl+L. Remove anything private."
      render: text
